[package]
name        = "cobs-nv"
version     = "0.1.2"
description = "Consistent Overhead Byte Stuffing: removes every zero byte from a payload so that a zero can delimit frames on a serial link, at a cost of at most one byte per 254 and never more.  Encodes into a caller's buffer without allocating, and reports a malformed frame as a value."
license     = "Apache-2.0"
stability   = "experimental"
category    = "encoding"
tags        = ["cobs", "framing", "serial", "embedded"]
repository  = "https://github.com/novolang/cobs-nv"
maintainers = ["novo-lang"]
main        = "src/main.nv"

# The README is the package's one page, and its own first heading is the
# package name — which says nothing in a list of this package's pages.
[docs.pages]
"README.md" = "Framing a byte stream with Consistent Overhead Byte Stuffing"

[dependencies]
# None.  std.bytes supplies the buffer and the cursor; the rest is the
# block walk.
